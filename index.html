<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lolo Transactions</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 16px; margin: 0; }
    .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #334155; }
    h2 { margin: 0 0 12px 0; font-size: 1.2rem; color: #38bdf8; }
    label { display: block; margin-top: 10px; font-size: 0.85rem; color: #94a3b8; }
    input, select { width: 100%; padding: 12px; margin-top: 4px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 1rem; -webkit-appearance: none; }
    button { width: 100%; padding: 14px; margin-top: 16px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; touch-action: manipulation; }
    button:disabled { background: #475569; opacity: 0.7; }
    .status { padding: 12px; margin-top: 12px; border-radius: 8px; font-size: 0.9rem; display: none; word-break: break-word; }
    .status.error { background: #7f1d1d; color: #fca5a5; display: block; }
    .status.success { background: #14532d; color: #86efac; display: block; }
    .status.info { background: #1e3a8a; color: #bfdbfe; display: block; }
    .tx-item { background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
    .tx-amount { font-weight: bold; color: #4ade80; text-align: right; }
    .del-btn { width: auto; padding: 6px 12px; margin: 0; background: #dc2626; font-size: 0.8rem; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Add Transaction</h2>
    <form id="txForm" action="javascript:void(0);">
      <label>User Name</label>
      <input type="text" id="username" required placeholder="e.g. John">

      <label>Type</label>
      <select id="type">
        <option value="deposit">Deposit</option>
        <option value="withdrawal">Withdrawal</option>
      </select>

      <label>DZD Amount</label>
      <input type="number" step="any" id="dzd" required placeholder="0.00">

      <label>CAD Amount</label>
      <input type="number" step="any" id="cad" required placeholder="0.00">

      <label>Date</label>
      <input type="date" id="date" required>

      <button type="submit" id="saveBtn">Save Transaction</button>
    </form>
    <div id="statusMsg" class="status"></div>
  </div>

  <div class="card">
    <h2>Transaction History</h2>
    <div id="txList">Loading transactions...</div>
  </div>

  <script>
    // Displays any hidden runtime JavaScript crashes directly on screen
    window.addEventListener('error', function(e) {
      showStatus('JS Error: ' + e.message + ' (line ' + e.lineno + ')', true);
    });

    const form = document.getElementById('txForm');
    const saveBtn = document.getElementById('saveBtn');
    const statusMsg = document.getElementById('statusMsg');
    const txList = document.getElementById('txList');

    try {
      document.getElementById('date').value = new Date().toISOString().split('T')[0];
    } catch(e) {}

    function showStatus(msg, isError = false, isInfo = false) {
      statusMsg.className = 'status ' + (isError ? 'error' : (isInfo ? 'info' : 'success'));
      statusMsg.textContent = msg;
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function loadTransactions() {
      try {
        const res = await fetch('/api/transactions');
        const text = await res.text();
        
        let data;
        try {
          data = JSON.parse(text);
        } catch(e) {
          throw new Error('Server non-JSON response: ' + text.substring(0, 100));
        }

        if (!res.ok || data.error) {
          throw new Error(data.error || ('HTTP ' + res.status));
        }

        if (!Array.isArray(data) || data.length === 0) {
          txList.innerHTML = '<p style="color: #64748b;">No transactions recorded yet.</p>';
          return;
        }

        txList.innerHTML = data.map(function(tx) {
          return `
            <div class="tx-item">
              <div>
                <strong>${escapeHtml(tx.username)}</strong> (${escapeHtml(tx.type)})
                <div style="color: #64748b; font-size: 0.8rem;">${escapeHtml(tx.date)}</div>
              </div>
              <div>
                <div class="tx-amount">${tx.cad} CAD / ${tx.dzd} DZD</div>
                <button type="button" class="del-btn" onclick="deleteTransaction('${tx.id}')">Delete</button>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        txList.innerHTML = `<p style="color: #fca5a5;">Error loading transactions: ${err.message}</p>`;
      }
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      e.stopPropagation();

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';
      showStatus('Saving transaction...', false, true);

      const payload = {
        id: 'tx_' + Date.now(),
        username: document.getElementById('username').value.trim(),
        type: document.getElementById('type').value,
        dzd: parseFloat(document.getElementById('dzd').value) || 0,
        cad: parseFloat(document.getElementById('cad').value) || 0,
        date: document.getElementById('date').value,
        editRequested: false,
        requestNote: ''
      };

      try {
        const res = await fetch('/api/transactions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const text = await res.text();
        let result;
        try {
          result = JSON.parse(text);
        } catch(pErr) {
          throw new Error('Server returned invalid data: ' + text.substring(0, 100));
        }

        if (!res.ok || result.error) {
          throw new Error(result.error || ('HTTP Error ' + res.status));
        }

        showStatus('Transaction saved successfully!', false);
        form.reset();
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
        await loadTransactions();
      } catch (err) {
        showStatus('Save Failed: ' + err.message, true);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Transaction';
      }
    });

    window.deleteTransaction = async function(id) {
      if (!confirm('Delete this transaction?')) return;

      try {
        const res = await fetch('/api/transactions', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: id })
        });

        const text = await res.text();
        let result;
        try { result = JSON.parse(text); } catch(e) {}

        if (!res.ok || (result && result.error)) {
          throw new Error((result && result.error) || 'Failed to delete');
        }

        await loadTransactions();
      } catch (err) {
        alert('Delete error: ' + err.message);
      }
    };

    loadTransactions();
  </script>
</body>
</html>
